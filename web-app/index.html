<!DOCTYPE html> <!--Tells browser its an HTML 5 doc-->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yinsh</title> <!-- Text shown in browser tab -->

    <link rel="stylesheet" href="default.css"> <!-- links CSS to this html file -->

</head>


<body>
    <main class="layout">
        <aside class="sidebar" aria-label="Game Configuration" >
            <h1>YINSH</h1>

            <section id="status" aria-label="Game Status" aria-live="polite" > 
                <p id="current-player">Current Player: White</p>
                <p id="phase">Phase: Setup</p>
            </section>

            <button id="restart" type="button">Restart Game</button>

             <div class="difficulty-button">
                    <div id="difficulty-row" class="ring-row">
                        <button id="Easy-difficulty" type="button" aria-pressed="false">Easy</button>
                        <button id="Hard-difficulty" type="button" aria-pressed="false">Hard</button>
                    </div>
                </div>       

             <p id="hover-coordinate" aria-live="polite">Hex Co-ordinate: none</p> 
        </aside>

        <section class="board-area" tabindex="0" aria-label="Yinsh Game Board">
            <div class="board-wrapper">
                <canvas id="board" width="600" height="600"  aria-label="Yinsh game board" role="img"   tabindex="0"></canvas>
                
                <div class="removed-panel top-right">
                    <div id="white-removed-rings" class="ring-row">
                        <div id="white-ring-1" class="removed-ring white"></div>
                        <div id="white-ring-2" class="removed-ring white"></div>
                        <div id="white-ring-3" class="removed-ring white"></div>
                    </div>
                </div>

                <div class="removed-panel bottom-left" >
                    <div id="black-removed-rings" class="ring-row" >
                        <div id="black-ring-1" class="removed-ring black"></div>
                        <div id="black-ring-2" class="removed-ring black"></div>
                        <div id="black-ring-3" class="removed-ring black"></div>
                    </div>
                </div>
            </div>
        </section>

        <dialog id="result-dialog" tabindex="0" aria-label="Game over message">
            <h2 id="winner-text"></h2>
            <button id="play-again">Play Again</button>
        </dialog>
    </main>     

    <script type="module" src="main.js"></script>


</body>
</html>
